<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="t d">
<title id="t">过载保护中的背压、丢弃、隔离和队列</title><desc id="d">请求先受容量判断；满载时在独立回路返回背压或拒绝；有容量才进入有界队列，由独立预算的消费者处理，失败进入死信处理。</desc>
<style>text{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#243b53}.title{font-size:37px;font-weight:700}.head{font-size:25px;font-weight:700}.body{font-size:20px}.note{font-size:19px;fill:#526779}.box{fill:#fff;stroke:#829bb0;stroke-width:3}.line{stroke:#68849b;stroke-width:4;fill:none}.error{stroke:#aa574d;stroke-width:4;fill:none;stroke-dasharray:9 8}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#68849b"/></marker><marker id="e" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#aa574d"/></marker></defs>
<rect width="1200" height="690" rx="30" fill="#fbf9f4"/><text x="600" y="67" text-anchor="middle" class="title">让过载在可控位置停下来</text><text x="600" y="108" text-anchor="middle" class="note">有界容量、明确拒绝、资源隔离和消息确认分别保护不同位置</text>
<rect class="box" x="35" y="285" width="175" height="125" rx="20"/><text x="122" y="335" text-anchor="middle" class="head">生产者</text><text x="122" y="373" text-anchor="middle" class="body">用户与服务</text>
<rect class="box" x="295" y="285" width="180" height="125" rx="20"/><text x="385" y="335" text-anchor="middle" class="head">容量判断</text><text x="385" y="373" text-anchor="middle" class="body">限流与配额</text>
<rect class="box" x="560" y="285" width="200" height="125" rx="20"/><text x="660" y="335" text-anchor="middle" class="head">有界队列</text><text x="660" y="373" text-anchor="middle" class="body">保留期与容量</text>
<rect class="box" x="840" y="205" width="315" height="145" rx="20"/><text x="997" y="257" text-anchor="middle" class="head">核心任务消费者</text><text x="997" y="300" text-anchor="middle" class="body">独立并发与连接预算</text>
<rect class="box" x="840" y="390" width="315" height="145" rx="20"/><text x="997" y="442" text-anchor="middle" class="head">普通任务消费者</text><text x="997" y="485" text-anchor="middle" class="body">独立预算、有限重试</text>
<path class="line" marker-end="url(#a)" d="M210 347h75m190 0h75m210 -15l70 -45m-70 80l70 60"/>
<rect class="box" x="270" y="485" width="230" height="105" rx="18"/><text x="385" y="527" text-anchor="middle" class="head">背压或拒绝</text><text x="385" y="562" text-anchor="middle" class="body">减速、429 或放弃次要工作</text><path class="error" marker-end="url(#e)" d="M385 410v66"/>
<rect class="box" x="600" y="555" width="215" height="95" rx="18"/><text x="707" y="597" text-anchor="middle" class="head">死信与人工处理</text><text x="707" y="627" text-anchor="middle" class="note">保留原因并受控重放</text><path class="error" marker-end="url(#e)" d="M997 535v65H825"/>
</svg>
