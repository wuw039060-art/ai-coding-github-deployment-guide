<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d">
<title id="t">公网入口与 DNS 解析</title><desc id="d">DNS 先提供地址，实际 HTTPS 请求到云平台入口，再经过可选防火墙、反向代理到应用。</desc>
<style>text{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#243b53}.title{font-size:37px;font-weight:700}.head{font-size:24px;font-weight:700}.body{font-size:20px}.line{stroke:#648099;stroke-width:4;fill:none}.dash{stroke-dasharray:9 8}.box{fill:#fff;stroke:#8aa2b6;stroke-width:3}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#648099"/></marker></defs>
<rect width="1200" height="620" rx="30" fill="#f7fafc"/><text x="600" y="70" text-anchor="middle" class="title">域名解析与公网请求，不是一条串行链</text>
<rect class="box" x="45" y="290" width="185" height="135" rx="20"/><text x="138" y="345" text-anchor="middle" class="head">浏览器</text><text x="138" y="385" text-anchor="middle" class="body">访问域名</text>
<rect class="box" x="300" y="125" width="215" height="110" rx="20"/><text x="407" y="176" text-anchor="middle" class="head">DNS</text><text x="407" y="207" text-anchor="middle" class="body">给出目标地址</text>
<path class="line dash" marker-end="url(#a)" d="M210 290L323 235"/><path class="line dash" marker-end="url(#a)" d="M300 208L208 277"/>
<rect class="box" x="300" y="290" width="195" height="135" rx="20"/><text x="398" y="345" text-anchor="middle" class="head">云平台入口</text><text x="398" y="385" text-anchor="middle" class="body">安全组／边缘</text>
<rect class="box" x="555" y="290" width="195" height="135" rx="20"/><text x="652" y="345" text-anchor="middle" class="head">主机防火墙</text><text x="652" y="385" text-anchor="middle" class="body">若部署了才有</text>
<rect class="box" x="810" y="290" width="160" height="135" rx="20"/><text x="890" y="345" text-anchor="middle" class="head">反向代理</text><text x="890" y="385" text-anchor="middle" class="body">HTTPS 终止</text>
<rect class="box" x="1030" y="290" width="135" height="135" rx="20"/><text x="1097" y="345" text-anchor="middle" class="head">应用</text><text x="1097" y="385" text-anchor="middle" class="body">服务</text>
<path class="line" marker-end="url(#a)" d="M230 357h62m203 0h52m203 0h52m168 0h52"/>
<text x="600" y="520" text-anchor="middle" class="body">HTTPS 请求沿下方路径前进；实际入口与防火墙层次取决于部署方式</text>
</svg>
